feishu:
  app_id: cli_xxx
  app_secret_env: FEISHU_APP_SECRET
  # preview shows throttled processing detail; concise hides it.
  card_display_mode: preview
  # Optional. All Feishu REST and WebSocket connections use this HTTP proxy.
  # Leave unset for direct connections.
  # proxy_url: http://127.0.0.1:7890
security:
  allowed_open_ids:
    - ou_xxx
app_server:
  command: codex
  default_model: ""
  startup_timeout_seconds: 15
workspace:
  default: /path/to/default/repo
# Optional aliases select additional local workspaces from a private chat.
projects:
  backend:
    cwd: /path/to/backend
    model: ""
